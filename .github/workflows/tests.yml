name: Package checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked --python '${{ matrix.python }}'
      - run: uv run --no-sync pytest -q
      - if: matrix.python == '3.14'
        run: uv run --no-sync ruff check src/lcl tests
      - if: matrix.python == '3.14'
        run: uv run --no-sync mypy src/lcl
