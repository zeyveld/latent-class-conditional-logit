[project]
name = "lcl-choice"
version = "0.1.36"
description = "A high-performance Python package for estimating latent-class conditional logit models."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

authors = [
  { name = "Andrew Zeyveld", email = "zeyveld@gmail.com" },
]

dependencies = [
    "jax>=0.5.3",
    "polars>=0.20.0",
    "jaxtyping>=0.2.25",
    "beartype>=0.17.0",
    "equinox>=0.13.6",
    "formulaic>=1.2.1",
    "pylatexenc>=2.10",
    "tabulate>=0.10",
    "pandas>=2.0",
    "scipy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lcl"]

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "ruff>=0.15.8",
]
docs = [
    "altair>=5.0",
    "mkdocs-autorefs>=1.4.4",
    "mkdocs-material>=9.7.6",
    "mkdocstrings[python]>=1.0.3",
]

[tool.ruff.lint]
extend-select = ["D"]
extend-ignore = [
    "F722",  # Ruff does not parse jaxtyping's shape-string annotations.
    "F821",  # Ruff treats jaxtyping dimension names as undefined variables.
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D100", "D103", "D104"]

[[tool.mypy.overrides]]
module = [
    "pandas",
    "pandas.*",
    "pylatexenc",
    "pylatexenc.*",
    "scipy",
    "scipy.*",
    "tabulate",
]
ignore_missing_imports = true
